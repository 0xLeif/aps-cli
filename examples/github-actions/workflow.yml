name: aps state example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      APS_HOME: ${{ runner.temp }}/aps-home
    steps:
      - uses: 0xLeif/aps-cli/.github/actions/install-aps@7373d124ebb3823c1f7f19651dfffe4d7ed83f51
        with:
          version: 1.1.0

      - name: Record build state
        run: |
          aps key add phase \
            --type String --storage FileState --path phase.json \
            --initial queued --doc "Current CI phase"
          aps key add candidateCommit \
            --type String --storage FileState --path candidate-commit.json \
            --initial "" --doc "Commit under test"
          aps set phase testing
          aps set candidateCommit "$GITHUB_SHA"
          aps dump --json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aps-state
          path: ${{ env.APS_HOME }}

  consume:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APS_HOME: ${{ runner.temp }}/aps-home
    steps:
      - uses: 0xLeif/aps-cli/.github/actions/install-aps@7373d124ebb3823c1f7f19651dfffe4d7ed83f51
        with:
          version: 1.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aps-state
          path: ${{ env.APS_HOME }}

      - name: Read state in a new job
        run: |
          aps schema --json
          test "$(aps get phase)" = "testing"
          test "$(aps get candidateCommit)" = "$GITHUB_SHA"
