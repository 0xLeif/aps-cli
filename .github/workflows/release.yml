name: Release

# Builds the binary release assets the 0xLeif/homebrew-tap formula points
# at (see Formula/fledge.rb in CorvidLabs/homebrew-tap for the pattern). Both macOS arches are
# built on macos-latest via `swift build --arch`; no Intel runner needed.
#
# Triggers:
# - tag push (v*): normal release path, assets attach to the tag's release.
# - workflow_dispatch with a tag input: backfill/repair assets on an existing
#   release (e.g. v1.0.0, which predates this workflow) without cutting a new
#   version. The post-release-formula workflow has the same recovery lever.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build/attach assets for (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  provenance:
    name: Release provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Dispatch may target a tag that predates this gate. Use current main
          # as the trusted control plane. Tag pushes use the immutable event
          # commit rather than resolving a tag that may have moved while queued.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch selected tag and attest notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch origin "+refs/notes/attest:refs/notes/attest"

      - name: Resolve exact tag commit
        id: resolve
        env:
          EVENT_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./Scripts/release-provenance-gate.sh --resolve-only "$RELEASE_TAG" "$EVENT_COMMIT"

      - name: Confirm candidate is reachable from the protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          git fetch origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor \
            "$RELEASE_COMMIT" "refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Verify signed release evidence
        id: attest
        uses: CorvidLabs/attest@e8a2d928eb4b9a33185c32ba7b8e9b3a985987f2 # 1.0.0
        with:
          version: "1.0.0"
          range: ${{ steps.resolve.outputs.commit }}^!
          policy: .attest-release.json

      - name: Confirm exact tag binding
        env:
          ATTEST_BIN: ${{ steps.attest.outputs.binary }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: ./Scripts/release-provenance-gate.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

  test:
    name: Test gate
    needs: provenance
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.provenance.outputs.commit }}
          persist-credentials: false
      - name: Verify release version contract
        env:
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
        run: |
          ./Scripts/prepare-version.py --check
          test "$RELEASE_TAG" = "v$(cat VERSION)"
      - run: swift build
      - run: swift test

  build:
    needs: [provenance, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: aps-macos-aarch64
          - os: macos-latest
            arch: x86_64
            artifact: aps-macos-x86_64
          - os: ubuntu-latest
            arch: ""
            artifact: aps-linux-x86_64-portable.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.provenance.outputs.commit }}
          persist-credentials: false

      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.0"

      - name: Build release binary
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT: ${{ matrix.artifact }}
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$ARCH" ]; then
            BIN_DIR=$(swift build -c release --arch "$ARCH" --show-bin-path)
            swift build -c release --arch "$ARCH"
          else
            BIN_DIR=$(swift build -c release --show-bin-path)
            # Linux 6.0.x toolchains: libswiftObservation.so has an undefined
            # swift::threading::fatal ref; tolerate it at the executable link
            # (same flag linux-smoke.yml uses for swift test). Build the final
            # portable executable before copying it into the archive.
            swift build -c release -Xlinker --allow-shlib-undefined \
              -Xlinker -rpath -Xlinker "\$ORIGIN/lib"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            package_dir="${ARTIFACT%.tar.gz}-bundle"
            mkdir -p "$package_dir/lib"
            cp "$BIN_DIR/aps" "$package_dir/aps"
            # Keep Swift/Foundation/Observation shared libraries beside aps;
            # the $ORIGIN/lib rpath makes this bundle runnable without Swift.
            readelf -d "$package_dir/aps" \
              | grep -E '(RPATH|RUNPATH).*\$ORIGIN/lib'
            ldd "$package_dir/aps" | awk '/=> \/|^\// { print ($3 ~ /^\// ? $3 : $1) }' | sort -u | while read -r dependency; do
              case "$dependency" in
                */swift/linux/*)
                  cp -L "$dependency" "$package_dir/lib/" ;;
              esac
            done
            test -n "$(find "$package_dir/lib" -type f -print -quit)"
            tar -C "$package_dir" -czf "$ARTIFACT" aps lib
            sha256sum "$ARTIFACT" | sed "s|.*/||" > "$ARTIFACT.sha256"

            # Exercise the same checksum and extraction path used by the
            # composite installer against this exact local artifact.
            installer_root="$RUNNER_TEMP/aps-installer-contract"
            mkdir -p "$installer_root"
            APS_RELEASE_BASE_URL="file://$PWD" \
              APS_VERSION="${RELEASE_TAG#v}" \
              APS_RUNNER_OS="Linux" \
              APS_RUNNER_ARCH="X64" \
              RUNNER_TEMP="$installer_root" \
              GITHUB_PATH="$installer_root/github-path" \
              GITHUB_ENV="$installer_root/github-env" \
              GITHUB_OUTPUT="$installer_root/github-output" \
              ./.github/actions/install-aps/install.sh
            "$installer_root/aps/bin/aps" --version
            test -n "$(find "$installer_root/aps/bin/lib" -type f -print -quit)"

            # The base Ubuntu image has no Swift toolchain. Mount the unpacked
            # bundle read-only and prove the executable is self-contained.
            docker run --rm \
              --volume "$PWD/$package_dir:/bundle:ro" \
              ubuntu:24.04 /bundle/aps --version
          else
            cp "$BIN_DIR/aps" "$ARTIFACT"
          fi
          test "$("$BIN_DIR/aps" --version)" = "${RELEASE_TAG#v}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [provenance, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Manual backfills use the current trusted gate even for old tags.
          # Tag pushes use the immutable commit already verified by provenance,
          # so a moved tag cannot replace the gate or release policy.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || needs.provenance.outputs.commit }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          for file in ./*; do
            [ -f "$file" ] || continue
            sha256sum "$file" | sed "s|.*/||" > "${file}.sha256"
          done
          cat -- ./*.sha256

      - name: Refresh release tag and attest notes
        env:
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch origin "+refs/notes/attest:refs/notes/attest"

      - name: Reverify signed release evidence
        id: attest
        uses: CorvidLabs/attest@e8a2d928eb4b9a33185c32ba7b8e9b3a985987f2 # 1.0.0
        with:
          version: "1.0.0"
          range: ${{ needs.provenance.outputs.commit }}^!
          policy: .attest-release.json

      - name: Recheck exact tag binding before publication
        env:
          ATTEST_BIN: ${{ steps.attest.outputs.binary }}
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.provenance.outputs.commit }}
        run: ./Scripts/release-provenance-gate.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.provenance.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

      - name: Verify remote tag after publication
        env:
          ATTEST_BIN: ${{ steps.attest.outputs.binary }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.provenance.outputs.commit }}
        run: |
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
            fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          ./Scripts/release-provenance-gate.sh \
            "$RELEASE_TAG" "$RELEASE_COMMIT"
